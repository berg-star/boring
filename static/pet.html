<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="领养一只只属于你的小东西。"><title>奇怪小宠物 · 无聊研究所</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23b9f879'/%3E%3Ctext x='7' y='29' font-size='28'%3E✳%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/achievements.css"><script defer src="/static/achievements.js"></script><script defer src="/static/main.js"></script><script defer src="/static/pet.js"></script><link rel="stylesheet" href="/static/pet.css"></head>
<body><div class="site-shell"><header class="header"><a class="brand" href="/"><span class="brand-mark">✳</span><span>无聊研究所<small>BORING LAB.</small></span></a><a class="header-link" href="/#playground">全部玩法 ↗</a></header>
<main class="game-main pet-main"><a class="back" href="/#playground">← 回游乐场</a><div class="game-heading"><p class="eyebrow">EXPERIMENT / 07</p><h1>捡到一只小东西。</h1><p>没什么大用，但它好像很喜欢你。</p></div>
<section class="panel pet-room" aria-label="宠物的小房间"><div class="pet-room-top"><span class="pill" id="pet-age">初次见面</span><span>ROOM / 001</span></div><p id="pet-speech" role="status">你好呀，给我起个名字吧。</p><div class="pet-stage" id="pet-stage"><div class="pet-shadow"></div><button id="pet" type="button" aria-label="戳一戳小宠物"><span class="pet-body"><span class="pet-tuft"></span><span class="pet-face"><span class="pet-eye"><i></i></span><span class="pet-eye"><i></i></span><span class="pet-cheek left"></span><span class="pet-cheek right"></span><span class="pet-mouth"></span></span></span></button><div id="away-note" hidden><span>✉</span><p>出去捡快乐了，<br>一会儿就回来。</p><button class="secondary" id="call-home" type="button">喊它回家</button></div><span class="room-sprout" aria-hidden="true">✿</span></div><h2 id="pet-name">小东西</h2><p id="pet-traits" class="help"></p><div class="pet-stats"><label>饱饱的 <meter id="pet-food" min="0" max="100"></meter><span id="food-value"></span></label><label>开心值 <meter id="pet-joy" min="0" max="100"></meter><span id="joy-value"></span></label></div></section>
<div class="game-actions"><button id="feed" class="primary" type="button">喂一口 ●</button><button id="play" class="secondary" type="button">陪它玩 ♡</button></div><form id="name-form" class="pet-name-form"><label for="name-input">给它起个名字</label><div><input id="name-input" maxlength="12" placeholder="最多 12 个字" autocomplete="off" required><button class="secondary" type="submit">就叫这个</button></div></form>
<p id="save-status" class="help" role="status"></p><details class="pet-backup"><summary>它的行李箱 · 备份与搬家</summary><p class="help">宠物保存在当前浏览器。清除网站数据会丢失，换设备可通过存档搬家。导入会替换当前宠物。</p><div class="game-actions"><button class="secondary" id="export-pet" type="button">导出存档 ↓</button><button class="secondary" id="import-pet" type="button">导入存档 ↑</button><input type="file" id="import-file" accept="application/json,.json" hidden></div><p id="backup-status" class="help" role="status"></p></details><p class="help">偶尔不来看它也没关系，它会照顾自己。<br>外形随机生成，没有账号，也不会上传你的宠物。</p></main><footer><span>✳ 无聊研究所 / 快乐不必有意义。</span><span>JUST FOR FUN. © 2026</span></footer></div></body></html>
