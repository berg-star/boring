<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="没有标准答案，只有你的脑洞。认真回答和胡说八道都可以。" />
    <title>奇怪问题 · 无聊研究所</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23b9f879'/%3E%3Ctext x='7' y='29' font-size='28'%3E✳%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/achievements.css" />
    <link rel="stylesheet" href="/static/question.css" />
    <script defer src="/static/achievements.js"></script>
    <script defer src="/static/main.js"></script>
    <script defer src="/static/random.js"></script>
  </head>
  <body data-mode="question">
    <div class="site-shell">
      <header class="header">
        <a class="brand" href="/">
          <span class="brand-mark">✳</span>
          <span>
            无聊研究所
            <small>BORING LAB.</small>
          </span>
        </a>
        <span class="header-note">不务正业，正在营业</span>
        <a class="header-link" href="/#playground">全部玩法 ↗</a>
      </header>
      <main class="game-main">
        <a class="back" href="/#playground">← 回游乐场</a>
        <div class="game-heading">
          <p class="eyebrow">EXPERIMENT / 04</p>
          <h1>奇怪问题</h1>
          <p>没有标准答案，只有你的脑洞。认真回答和胡说八道都可以。</p>
        </div>
        <section class="question-picker" aria-labelledby="question-picker-title">
          <div class="question-picker-heading">
            <h2 id="question-picker-title">今天开哪种脑洞？</h2>
            <span id="question-total">100 道问题 · 四种主题</span>
          </div>
          <div class="question-themes" role="group" aria-label="选择问题主题">
            <button type="button" data-theme="all" aria-pressed="true">
              全部
              <span data-question-count="all">100</span>
            </button>
            <button type="button" data-theme="imagination" aria-pressed="false">
              脑洞大开
              <span data-question-count="imagination">25</span>
            </button>
            <button type="button" data-theme="life" aria-pressed="false">
              生活小事
              <span data-question-count="life">25</span>
            </button>
            <button type="button" data-theme="choice" aria-pressed="false">
              离谱选择
              <span data-question-count="choice">25</span>
            </button>
            <button type="button" data-theme="objects" aria-pressed="false">
              万物开口
              <span data-question-count="objects">25</span>
            </button>
          </div>
        </section>
        <div id="result" class="panel question-panel" aria-live="polite">
          <div class="result-kicker">A VERY SERIOUS NONSENSE QUESTION</div>
          <span id="question-theme-label" class="question-theme-label">正在准备</span>
          <div class="question-mark" aria-hidden="true">“</div>
          <p class="question-text" id="question">一个奇怪的问题正在赶来的路上……</p>
          <p class="help">想一想，或者抛给旁边的人。</p>
        </div>
        <div class="game-actions">
          <button class="primary" id="draw" type="button">再来一个 ↻</button>
        </div>
        <p id="api-error" class="error" role="status"></p>
        <p class="help">题目会轮换，避开最近 8 道。切换主题就会抽一道新的。</p>
        <p class="help">不用提交答案。一个人想一想，或和朋友聊一聊，都可以。</p>
      </main>
      <footer>
        <span>
          ✳ 无聊研究所
          <span class="footer-divider">/</span>
          快乐不必有意义。
        </span>
        <span>JUST FOR FUN. © 2026</span>
      </footer>
    </div>
  </body>
</html>
