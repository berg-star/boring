<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="眼睛说会了，手跟上了吗？等区域变绿，立刻点击。" />
    <title>反应速度测试 · 无聊研究所</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23b9f879'/%3E%3Ctext x='7' y='29' font-size='28'%3E✳%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/achievements.css" />
    <script defer src="/static/achievements.js"></script>
    <script defer src="/static/main.js"></script>
    <script defer src="/static/reaction.js"></script>
  </head>
  <body data-mode="reaction">
    <div class="site-shell">
      <header class="header">
        <a class="brand" href="/">
          <span class="brand-mark">✳</span>
          <span>
            无聊研究所
            <small>BORING LAB.</small>
          </span>
        </a>
        <span class="header-note">不务正业，正在营业</span>
        <a class="header-link" href="/#playground">全部玩法 ↗</a>
      </header>
      <main class="game-main">
        <a class="back" href="/#playground">← 回游乐场</a>
        <div class="game-heading">
          <p class="eyebrow">EXPERIMENT / 01</p>
          <h1>反应速度测试</h1>
          <p>眼睛说会了，手跟上了吗？等区域变绿，立刻点击。</p>
        </div>
        <button
          id="reaction-pad"
          class="reaction-pad idle"
          type="button"
          aria-describedby="reaction-help"
        >
          <span class="pad-icon" aria-hidden="true">ϟ</span>
          <strong id="reaction-title" aria-live="polite">点击开始</strong>
          <span id="reaction-hint">先稳住，再出手。</span>
        </button>
        <div class="stats">
          <span>
            本次成绩
            <b id="last-score">—</b>
          </span>
          <span>
            会话最佳
            <b id="best-score">还没有成绩</b>
          </span>
        </div>
        <p class="help" id="reaction-help">
          点击区域或聚焦后按空格 / Enter。变绿前点击，会判定为抢跑。
          <br />
          成绩仅供娱乐，设备和屏幕延迟会影响结果。
        </p>
      </main>
      <footer>
        <span>
          ✳ 无聊研究所
          <span class="footer-divider">/</span>
          快乐不必有意义。
        </span>
        <span>JUST FOR FUN. © 2026</span>
      </footer>
    </div>
  </body>
</html>
