name: Check Docker build
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build -t boring-lab:check .
      - name: Check container with a non-default PORT
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name boring-lab-check -e PORT=18081 -p 127.0.0.1:18081:18081 boring-lab:check
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:18081/healthz
          python3 tools/check-http.py http://127.0.0.1:18081
          test "$(docker exec boring-lab-check id -u)" = "10001"
      - name: Install online test tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .qa/ci-venv
          . .qa/ci-venv/bin/activate
          python -m pip install 'websockets==15.0.1'
          npm install --prefix tools --no-audit --no-fund
          ./tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check all six online games and unconnected guest expiry
        shell: bash
        run: |
          set -euo pipefail
          . .qa/ci-venv/bin/activate
          export BASE_URL=http://127.0.0.1:18081
          export CHROME_PATH="$(node -p "require('./tools/node_modules/playwright').chromium.executablePath()")"
          node tools/check-tug-online.cjs
          python tools/check-reaction-online.py "$BASE_URL"
          python tools/check-password-online.py "$BASE_URL"
          python tools/check-puzzle-online.py "$BASE_URL"
          python tools/check-word-online.py "$BASE_URL"
          python tools/check-harmony-online.py "$BASE_URL"
          python tools/check-room-join-expiry.py "$BASE_URL"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs boring-lab-check || true
          docker rm -f boring-lab-check || true
